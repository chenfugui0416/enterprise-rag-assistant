[project]
name = "rag-assistant-api"
version = "0.1.0"
description = "企业级 RAG 智能助手 — FastAPI 后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "charset-normalizer>=3.4",
    "greenlet>=3.1",
    "markdown-it-py>=3.0",
    "pgvector>=0.3.6",
    "PyJWT>=2.9",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: requires a reachable PostgreSQL database with pgvector",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

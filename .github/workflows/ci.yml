name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的旧运行自动取消，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: 后端 · lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      - name: Ruff 静态检查
        run: .venv/bin/ruff check .

      - name: Ruff 格式检查
        run: .venv/bin/ruff format --check .

      - name: Pytest
        # 默认 mock provider，CI 无需任何 API Key
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
        run: .venv/bin/python -m pytest

  web:
    name: 前端 · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

      - name: 依赖漏洞审计
        run: npm audit --audit-level=high

  e2e:
    name: 端到端 · Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装后端依赖
        working-directory: apps/api
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装前端依赖
        working-directory: apps/web
        run: npm ci

      - name: 安装 Playwright 浏览器
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: 运行 e2e
        working-directory: apps/web
        run: npm run e2e

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    name: 容器 · 构建校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 配置
        run: docker compose config --quiet

      - name: 构建后端镜像
        run: docker build -t rag-api:ci apps/api

      - name: 构建前端镜像
        run: docker build -t rag-web:ci apps/web
